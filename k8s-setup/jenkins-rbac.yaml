apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-robot
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-robot-binding
subjects:
- kind: ServiceAccount
  name: jenkins-robot
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# For Kubernetes 1.24+, create a Secret to generate a permanent token for the ServiceAccount
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-robot-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: jenkins-robot
type: kubernetes.io/service-account-token
