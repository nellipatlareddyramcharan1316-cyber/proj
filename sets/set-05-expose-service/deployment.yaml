apiVersion: apps/v1
kind: Deployment
metadata:
  name: exposed-web-deployment
  namespace: default
  labels:
    app: exposed-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exposed-web
  template:
    metadata:
      labels:
        app: exposed-web
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
