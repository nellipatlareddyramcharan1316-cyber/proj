apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshoot-demo-app
  namespace: default
  labels:
    app: troubleshoot-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshoot-demo
  template:
    metadata:
      labels:
        app: troubleshoot-demo
    spec:
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
